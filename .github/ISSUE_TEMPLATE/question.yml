name: 質問
description: Sift の挙動、対応範囲、開発について質問する。
body:
  - type: markdown
    attributes:
      value: |
        質問に必要な範囲だけ状況を書いてください。認証情報、非公開の投稿、個人情報は送らないでください。

  - type: textarea
    id: question
    attributes:
      label: 質問
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 背景
      description: "試したことや、対象のサイトと画面があれば書いてください。"

name: Chrome ウェブストア提出

on:
  workflow_dispatch:
    inputs:
      version:
        description: 提出する package.json のバージョン
        required: true
        type: string
      check_only:
        description: 接続確認だけを行う（アップロード・審査提出なし）
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  package:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: 提出対象を確認する
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          version=$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            test "$GITHUB_REF_NAME" = "v$version"
          else
            test "$REQUESTED_VERSION" = "$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3
      - run: echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: npm run check
      - run: npm run package:store

      - name: 検証済み ZIP を保存する
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir store-package
          cp ".output/store/sift-$VERSION-chrome.zip" store-package/extension.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chrome-web-store-package
          path: store-package/extension.zip
          if-no-files-found: error
          retention-days: 14

  submit:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: chrome-web-store
      url: https://chromewebstore.google.com/detail/sift/jglehalaegleehefcefnfmmbblgkomeh
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chrome-web-store-package
          path: store-package

      - name: 提出 ZIP のバージョンを確認する
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          unzip -t store-package/extension.zip
          unzip -p store-package/extension.zip manifest.json |
            jq -e --arg version "$VERSION" '.version == $version and .manifest_version == 3' > /dev/null

      - name: 接続設定を確認する
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          for name in CWS_PUBLISHER_ID CWS_EXTENSION_ID GCP_SERVICE_ACCOUNT GCP_WORKLOAD_IDENTITY_PROVIDER; do
            if [ -z "${!name}" ]; then
              echo "::error::chrome-web-store Environment に $name を設定してください。"
              exit 1
            fi
          done

      - name: Google に認証する
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          export_environment_variables: false

      - name: ストアへの接続を確認する
        if: github.event_name == 'workflow_dispatch' && inputs.check_only
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          node --input-type=module <<'JS'
          const { CWS_ACCESS_TOKEN, CWS_PUBLISHER_ID, CWS_EXTENSION_ID } = process.env;
          const url = `https://chromewebstore.googleapis.com/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}:fetchStatus`;
          const response = await fetch(url, {
            headers: { Authorization: `Bearer ${CWS_ACCESS_TOKEN}` },
            redirect: 'error',
            signal: AbortSignal.timeout(30_000),
          });
          if (!response.ok) throw new Error(`ストアへの接続確認に失敗しました: HTTP ${response.status}`);
          const status = await response.json();
          if (!status.publishedItemRevisionStatus?.state) throw new Error('公開版の状態を確認できません。');
          console.log(`ストアへの接続を確認しました。公開版の状態: ${status.publishedItemRevisionStatus.state}`);
          JS

      - name: アップロードして審査へ提出する
        if: github.event_name != 'workflow_dispatch' || !inputs.check_only
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_ZIP_PATH: store-package/extension.zip
          CWS_VERSION: ${{ needs.package.outputs.version }}
        run: node scripts/submit-store.ts

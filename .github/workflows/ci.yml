name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチへの後続の push が前の push を追い越したなら、前の実行を
# 最後まで走らせる必要はない。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: 秘密情報検査
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # pull request と push に含まれるコミットを比較できるよう、履歴を省略しない。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # pull request の読み取り権限だけを使い、コメントは作らない。
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_VERSION: "8.30.1"

  verify:
    runs-on: ubuntu-latest
    # ジョブ全体で25秒ほど。上限をそこから大きく離してあるのは意図的で、
    # これは予算ではなく、ハングしたステップが GitHub 既定の6時間まで走り
    # 続けるのを止めるためだけのもの。vitejs/vite は20分、vitest-dev/vitest
    # は10分を、これより一桁長いジョブに置いている。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      # インストール時のフックが2つ走る。postinstall（`wxt prepare`＝この
      # ビルドが要る WXT の設定を生成する）と prepare（`scripts/setup.ts`＝
      # git に .githooks を指させるだけで、インストールを失敗させないように
      # 書いてある）。
      - run: npm ci

      # `biome ci`＝整形・lint 規則・import 順を、いずれも書き換えずに検査
      # する。最初に置くのは、実行が落ちるなら一番速く落ちる経路だから。
      - run: npm run lint

      - run: npm test

      # `wxt build` のあとに verify:manifest＝生成された release の manifest
      # が、ソースの宣言どおりのものを持っているか（content script を含む）。
      - run: npm run build

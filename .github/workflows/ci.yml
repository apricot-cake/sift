name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push that supersedes an earlier one on the same branch does not need the
# earlier run to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # The whole job takes about 25 seconds. The ceiling is set far above that on
    # purpose — it is not a budget, only a stop for a step that has hung and
    # would otherwise run to GitHub's six-hour default. vitejs/vite uses 20
    # minutes and vitest-dev/vitest 10 for jobs an order of magnitude longer
    # than this one.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      # Pulls in the two install hooks: postinstall (`wxt prepare`, which
      # generates the WXT config this build needs) and prepare
      # (`scripts/setup.ts`, which only points git at .githooks and is written
      # to never fail an install).
      - run: npm ci

      # `biome ci` — formatting, lint rules and import order, none of it
      # rewritten. First because it is the fastest way for the run to fail.
      - run: npm run lint

      - run: npm test

      # `wxt build` followed by verify:manifest — the generated release manifest
      # has to carry what the sources declare, the content script included.
      - run: npm run build

      # The same build for Firefox, which is not a claim that Sift runs there —
      # nothing has ever been tested against it. wxt.config.ts pins
      # manifestVersion to 3 so that Firefox does not fall back to MV2, and this
      # is the only thing that ever exercises that decision: without it, the
      # config could drift into something Chrome-only and nothing would say so.
      - run: npm run build:firefox

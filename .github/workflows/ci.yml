name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

# 同じブランチへの後続の push が前の push を追い越したなら、前の実行を
# 最後まで走らせる必要はない。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # ジョブ全体で25秒ほど。上限をそこから大きく離してあるのは意図的で、
    # これは予算ではなく、ハングしたステップが GitHub 既定の6時間まで走り
    # 続けるのを止めるためだけのもの。vitejs/vite は20分、vitest-dev/vitest
    # は10分を、これより一桁長いジョブに置いている。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      # PR 本文が編集された時にも走る。文字列としての `\n` は見た目の改行に
      # ならないので、既存の必須CIを失敗させてマージ前に止める。
      - if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/verify-pr-body.ts

      # インストール時のフックが2つ走る。postinstall（`wxt prepare`＝この
      # ビルドが要る WXT の設定を生成する）と prepare（`scripts/setup.ts`＝
      # git に .githooks を指させるだけで、インストールを失敗させないように
      # 書いてある）。
      - run: npm ci

      # `biome ci`＝整形・lint 規則・import 順を、いずれも書き換えずに検査
      # する。最初に置くのは、実行が落ちるなら一番速く落ちる経路だから。
      - run: npm run lint

      - run: npm test

      # `wxt build` のあとに verify:manifest＝生成された release の manifest
      # が、ソースの宣言どおりのものを持っているか（content script を含む）。
      - run: npm run build

      # Firefox 向けの同じビルド。Sift が Firefox で動くという主張ではない
      # ＝一度も検証していない。wxt.config.ts が manifestVersion を 3 に固定
      # しているのは Firefox を MV2 へ落とさないためで、その判断を実際に通す
      # のはここだけ。無ければ設定が Chrome 専用へ流れても誰も言わない。
      - run: npm run build:firefox

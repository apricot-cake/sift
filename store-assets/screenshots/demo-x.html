<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sift 掲載画像用の架空投稿</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color: #0f1419; background: #fff; font: 15px/1.45 Arial, "Meiryo", sans-serif; }
      .layout { display: grid; grid-template-columns: 72px minmax(0, 600px); max-inline-size: 672px; margin-inline: auto; }
      nav { padding: 18px 20px; display: flex; flex-direction: column; align-items: center; gap: 30px; }
      nav svg { inline-size: 25px; block-size: 25px; fill: none; stroke: currentColor; stroke-width: 1.7; }
      .brand { font-size: 27px; line-height: 1; }
      main { min-inline-size: 0; border-inline: 1px solid #eff3f4; }
      header { padding: 13px 16px 11px; border-block-end: 1px solid #eff3f4; }
      h1 { margin: 0; font-size: 20px; }
      article { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; padding: 13px 16px 11px; border-block-end: 1px solid #eff3f4; }
      .avatar { inline-size: 40px; block-size: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: bold; }
      .post { min-inline-size: 0; }
      .author { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; font-size: 14px; }
      .author strong { font-size: 15px; }
      .muted { color: #536471; }
      a { color: inherit; text-decoration: none; }
      .text { margin: 5px 0 10px; min-block-size: 22px; }
      .media { inline-size: 100%; aspect-ratio: 16 / 4; border-radius: 14px; border: 1px solid #00000008; }
      .metrics { display: flex; justify-content: space-between; margin-block-start: 11px; color: #536471; font-size: 12px; }
      .metrics button { display: inline-flex; align-items: center; gap: 6px; border: 0; padding: 0; color: inherit; background: none; font: inherit; }
      .metrics svg { inline-size: 17px; block-size: 17px; fill: none; stroke: currentColor; stroke-width: 1.5; }
      @media (max-width: 680px) { .layout { grid-template-columns: 52px minmax(0, 1fr); } nav { padding-inline: 12px; } }
    </style>
  </head>
  <body>
    <div class="layout">
      <nav aria-label="画面例のナビゲーション">
        <span class="brand" aria-label="X">𝕏</span>
        <svg aria-label="ホーム" role="img" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v11h-6v-7H9v7H3Z"/></svg>
        <svg aria-label="検索" role="img" viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg>
        <svg aria-label="通知" role="img" viewBox="0 0 24 24"><path d="M5 17h14l-2-4V9a5 5 0 0 0-10 0v4Zm5 3h4"/></svg>
        <svg aria-label="メッセージ" role="img" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/></svg>
        <svg aria-label="リスト" role="img" viewBox="0 0 24 24"><path d="M5 3h14v18H5ZM8 8h8M8 12h8M8 16h5"/></svg>
      </nav>
      <main data-testid="primaryColumn">
        <header>
          <h1>サンプルリスト</h1>
        </header>
        <section aria-label="架空の投稿一覧" id="posts"></section>
      </main>
    </div>
    <script>
      const accounts = [
        { name: "そらの記録", handle: "demo_account_a", avatar: "#528cac", initial: "空" },
        { name: "ひかりの便り", handle: "demo_account_b", avatar: "#b87459", initial: "光" },
        { name: "森のメモ", handle: "demo_account_c", avatar: "#548c72", initial: "森" },
      ];
      const samples = [
        { account: 0, text: "今日の色を一枚に。空色のサンプルを作りました。", likes: 120000, label: "12万", color: "#9fd2ea" },
        { account: 1, text: "やわらかな色で、少し気分を変えてみました。", likes: 24000, label: "2.4万", color: "#edb4a0" },
        { account: 2, text: "緑をテーマにした、今日のサンプルです。", likes: 150000, label: "15万", color: "#add6c1" },
        { account: 0, text: "もう一枚は、落ち着いた紫色にしてみました。", likes: 48000, label: "4.8万", color: "#cabcec" },
        { account: 1, text: "明るい色を集めて、黄色のサンプルを追加しました。", likes: 110000, label: "11万", color: "#e5ce91" },
        { account: 2, text: "青みのあるグレーも、色の記録に加えました。", likes: 6800, label: "6,800", color: "#b2c3d4" },
      ];
      const icon = (path) => `<svg aria-hidden="true" viewBox="0 0 24 24">${path}</svg>`;
      const reply = icon('<path d="M21 11a9 9 0 0 1-9 9H4l1-4a9 9 0 1 1 16-5Z"/>');
      const repost = icon('<path d="m4 7 3-3 3 3M7 4v13h8m5 0-3 3-3-3m3 3V7H9"/>');
      const like = icon('<path d="M12 21 3 12a6 6 0 0 1 9-8 6 6 0 0 1 9 8Z"/>');
      const views = icon('<path d="M5 20V10m5 10V4m5 16v-7m5 7V8"/>');
      const posts = document.getElementById("posts");
      for (const [index, sample] of samples.entries()) {
        const account = accounts[sample.account];
        const cell = document.createElement("div");
        cell.dataset.testid = "cellInnerDiv";
        cell.innerHTML = `<article data-testid="tweet">
          <div data-testid="Tweet-User-Avatar" class="avatar" style="background:${account.avatar}">${account.initial}</div>
          <div class="post">
            <div data-testid="User-Name" class="author"><strong>${account.name}</strong><span class="muted">@${account.handle}</span><span class="muted">·</span><a href="/${account.handle}/status/${9000000000000000000n + BigInt(index)}"><time class="muted" datetime="2026-10-04T03:00:00Z">10月4日</time></a></div>
            <div data-testid="tweetText" class="text">${sample.text}</div>
            <div data-testid="tweetPhoto" class="media" role="img" aria-label="架空投稿の単色画像" style="background:${sample.color}"></div>
            <div class="metrics" role="group" aria-label="${sample.likes} 件のいいね">
              <button type="button" aria-label="${12 + index * 7} 件の返信">${reply}<span>${12 + index * 7}</span></button>
              <button type="button" aria-label="${120 + index * 80} 件のリポスト">${repost}<span>${120 + index * 80}</span></button>
              <button type="button" data-testid="like" aria-label="${sample.likes} 件のいいね">${like}<span>${sample.label}</span></button>
              <button type="button" aria-label="表示回数">${views}<span>${30 + index * 11}万</span></button>
            </div>
          </div>
        </article>`;
        posts.append(cell);
      }
    </script>
  </body>
</html>

# 既定ロケール。@wxt-dev/i18n はここから型（GeneratedI18nStructure）を作るので、
# 新しいキーはまずここへ足す。他の言語ファイルはこのキー集合と揃っているかを
# locales/locales.test.ts が検査する。
#
# toolbarHitCount・toolbarRisingCount・toolbarHiddenCount の3つが複数形分岐
# （1 / n）を持つのは、モジュールの複数形機構が1メッセージにつき1つの数しか
# 取れないため＝もともと3つの数を1つの文へ詰めていた toolbarStatusCounts では
# es / pt-BR の名詞・形容詞を数に一致させられない。3つへ分けたうえで、
# toolbarStatusCounts はそれらを並べる側（$1 / $2 / $3）へ役目を変えている。


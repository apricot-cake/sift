<!doctype html>
<!-- `en` is the default locale, and this document is written in it. main.ts
     replaces both the text and this attribute once it has read the messages for
     the browser's own language. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- A tab of its own rather than the pane embedded in chrome://extensions.
         Adding a Misskey instance asks Chrome for a host permission, and the
         dialog that appears tears down whatever opened it if that was a popup
         (#28); a tab stays put. WXT reads this into options_ui.open_in_tab. -->
    <meta name="manifest.open_in_tab" content="true">
    <title>Sift</title>
  </head>
  <!-- Every reader-visible string carries the message name that replaces it:
       `data-i18n` for the element's text, the two suffixed forms for an
       attribute. localizeDocument() in main.ts is what fills them in.

       The English text is written out rather than left empty, and
       utils/i18n.test.ts holds it to the same words as public/_locales/en. An
       empty element would read as empty to everything that looks at the markup
       without running it — a screen reader in the moment before main.ts runs, a
       linter, a person. -->
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

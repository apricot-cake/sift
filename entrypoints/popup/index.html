<!doctype html>
<!-- `en` is the default locale, and this document is written in it. main.ts
     replaces both the text and this attribute once it has read the messages for
     the browser's own language. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sift</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="popup">
      <h1>Sift</h1>
      <p data-role="status" aria-live="polite" data-i18n="popupStatusLoading">Checking this site…</p>
      <button type="button" data-role="toggle-filtering" disabled data-i18n="popupEnableFiltering">Turn filtering on</button>
      <button type="button" data-role="open-options" data-i18n="popupOpenOptions">Open settings</button>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>

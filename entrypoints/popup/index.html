<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sift</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="settings">
      <header class="app-header">
        <h1>Sift</h1>
        <p>表示中の投稿を共通の条件で絞り込みます</p>
      </header>
      <section aria-labelledby="filter-heading">
        <h2 id="filter-heading">フィルター</h2>
        <label class="setting-row">
          <span class="setting-label">フィルターを有効にする</span>
          <input data-setting="enabled" type="checkbox">
        </label>
      </section>
      <section aria-labelledby="standard-heading">
        <h2 id="standard-heading">通常</h2>
        <label class="setting-row">
          <span class="setting-label">最低いいね数</span>
          <input data-setting="minLikes" type="number" min="0" step="50">
        </label>
      </section>
      <section aria-labelledby="rising-heading">
        <h2 id="rising-heading">上昇中</h2>
        <label class="setting-row">
          <span class="setting-label">上昇中の投稿を表示する</span>
          <input data-setting="risingEnabled" type="checkbox">
        </label>
        <label class="setting-row">
          <span class="setting-label">最低いいね数</span>
          <input data-setting="risingMinLikes" type="number" min="0" step="10">
        </label>
        <label class="setting-row">
          <span class="setting-label">投稿後の時間</span>
          <span class="input-with-unit"><input data-setting="risingMaxAgeHours" type="number" min="1" max="168">時間</span>
        </label>
      </section>
      <section aria-labelledby="post-heading">
        <h2 id="post-heading">投稿</h2>
        <label class="setting-row">
          <span class="setting-label">メディア</span>
          <select data-setting="mediaMode"><option value="any">画像・動画</option><option value="images">画像のみ</option></select>
        </label>
        <label class="setting-row">
          <span class="setting-label">リポストを除外する</span>
          <input data-setting="hideReposts" type="checkbox">
        </label>
      </section>
      <section aria-labelledby="misskey-heading">
        <h2 id="misskey-heading">Misskeyインスタンス</h2>
        <ul class="instance-list" data-role="instance-list"></ul>
        <form class="instance-form" data-role="instance-form">
          <input
            data-role="instance-input"
            type="text"
            placeholder="例: misskey.io"
            aria-label="追加するMisskeyインスタンスのホスト名"
          >
          <button type="submit">追加</button>
        </form>
        <p class="instance-error" data-role="instance-error" role="alert"></p>
        <p class="note">追加すると、そのホストだけへのアクセス許可をChromeが確認します。</p>
      </section>
      <footer>
        <p class="status" data-role="status" role="status" aria-live="polite">読み込み中…</p>
        <p class="note">設定は自動保存され、対応している投稿一覧に反映されます。</p>
      </footer>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
